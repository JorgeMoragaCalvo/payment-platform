spring.application.name=payment-platform

# Local development datasource. Every value can be overridden by an environment variable, which is
# how non-local deployments must supply them — no credentials belong in this file beyond the local
# defaults below.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/uvopos_local?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USERNAME:uvopos}
spring.datasource.password=${DB_PASSWORD:uvopos_local}

# validate, never update or create: the schema is owned by Flyway here and by hand-written DDL in
# production. This setting is also the cheapest check that the entity mappings match the columns —
# a renamed or missing column fails at startup instead of at the first query.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway is for local development and tests ONLY. The production database is owned by a much
# larger system with its own migration history, and its DDL is applied by hand in a maintenance
# window. Never point this at it.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
