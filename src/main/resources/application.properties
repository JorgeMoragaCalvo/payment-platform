spring.application.name=payment-platform

# Local development datasource. Every value can be overridden by an environment variable, which is
# how non-local deployments must supply them — no credentials belong in this file beyond the local
# defaults below.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/uvopos_local?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USERNAME:uvopos}
spring.datasource.password=${DB_PASSWORD:uvopos_local}

# validate, never update or create: the schema is owned by Flyway here and by hand-written DDL in
# production. This setting is also the cheapest check that the entity mappings match the columns —
# a renamed or missing column fails at startup instead of at the first query.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Production columns are camelCase (proximoPago, RazonSocial, tipoPlan, nivelUvo). Spring's default
# naming strategy rewrites even explicit @Column names to snake_case, which turns proximoPago into
# proximo_pago and fails validation. This strategy uses the names exactly as declared.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Flyway is for local development and tests ONLY. The production database is owned by a much
# larger system with its own migration history, and its DDL is applied by hand in a maintenance
# window. Never point this at it.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Where uploaded bank statements are kept for audit. MUST stay private: a statement lists every
# movement of the company's bank account, so this directory belongs outside any web root and
# outside anything served statically.
cartolas.root=${CARTOLAS_ROOT:./var/cartolas}

# ---------------------------------------------------------------------------
# Session cookie
# ---------------------------------------------------------------------------
# same-site=lax is the setting the gateway return leg is designed around: a Lax cookie is NOT sent
# on the cross-site POST the gateway sends the customer back with, which is exactly why the pending
# payment lives in its own table keyed by buy order instead of in the session. Do NOT relax this to
# "none" to make that route simpler — it weakens every cookie in the app to buy one endpoint.
server.servlet.session.timeout=120m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_SECURE_COOKIE:false}

# ---------------------------------------------------------------------------
# Payment status thresholds
# ---------------------------------------------------------------------------
payment-alert.due-soon-days=${PAYMENT_ALERT_DUE_SOON_DAYS:3}
payment-alert.overdue-grace-days=${PAYMENT_ALERT_OVERDUE_GRACE_DAYS:3}

# ---------------------------------------------------------------------------
# Frontend and public URL
# ---------------------------------------------------------------------------
# Where the gateway return leg sends the browser after a checkout. Empty means "this same origin",
# which is the intended deployment: frontend and API served from one host, so the session cookie
# (SameSite=Lax) keeps working and the return lands where the cookie is valid.
app.frontend-url=${APP_FRONTEND_URL:}

# The absolute URL the gateway calls back. It has to be public and HTTPS — the return leg cannot be
# exercised over http://localhost, even against the gateway's integration environment.
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}

# ---------------------------------------------------------------------------
# Webpay Plus
# ---------------------------------------------------------------------------
# The sandbox commerce code and key are intentionally absent: they come from the payment SDK's own
# constants and must be taken from the SDK chosen during integration, not copied from memory.
webpay.environment=${WEBPAY_ENVIRONMENT:integration}
webpay.commerce-code=${WEBPAY_COMMERCE_CODE:}
webpay.api-key=${WEBPAY_API_KEY:}

# ---------------------------------------------------------------------------
# Bank reconciliation
# ---------------------------------------------------------------------------
bank-reconciliation.suggest-threshold=${BANK_RECON_SUGGEST_THRESHOLD:40}
bank-reconciliation.high-confidence-threshold=${BANK_RECON_HIGH_THRESHOLD:80}
bank-reconciliation.tie-margin=${BANK_RECON_TIE_MARGIN:10}

bank-reconciliation.signals.rut_in_glosa=50
bank-reconciliation.signals.amount_exact=30
bank-reconciliation.signals.amount_close=15
bank-reconciliation.signals.date_window=15
bank-reconciliation.signals.name_tokens=10

# The kill switch. Turning this off sends every deposit back to the review queue.
bank-reconciliation.auto-confirm.enabled=${BANK_RECON_AUTO_CONFIRM:true}
bank-reconciliation.auto-confirm.require-signals[0]=rut_in_glosa
bank-reconciliation.auto-confirm.require-signals[1]=amount_exact

bank-reconciliation.amount-tolerance-pct=${BANK_RECON_AMOUNT_TOLERANCE_PCT:2}
bank-reconciliation.amount-tolerance-clp=${BANK_RECON_AMOUNT_TOLERANCE_CLP:1000}
bank-reconciliation.date-window-before-days=${BANK_RECON_WINDOW_BEFORE_DAYS:5}
bank-reconciliation.date-window-after-days=${BANK_RECON_WINDOW_AFTER_DAYS:30}

bank-reconciliation.transbank-glosa-patterns[0]=TRANSBANK
bank-reconciliation.transbank-glosa-patterns[1]=TBK
bank-reconciliation.transbank-glosa-patterns[2]=REDBANC
bank-reconciliation.settlement-lag-days=${BANK_RECON_SETTLEMENT_LAG_DAYS:2}
bank-reconciliation.transbank-commission-pct=${BANK_RECON_TBK_COMMISSION_PCT:0}
bank-reconciliation.settlement-tolerance-clp=${BANK_RECON_TOLERANCE_CLP:100}

# Cartola layouts. No Chilean bank publishes an account API, so movements come from the CSV export
# downloaded from the bank's portal, and every bank names its columns differently. Supporting one
# more bank is an entry here, not a code change.
#
# Only `chile` and `santander` have fixtures, and those were written by hand rather than exported
# from a bank. `bci`, `estado` and `generic` are informed guesses: get one real export per bank
# before offering it in the dropdown.
bank-reconciliation.banks.chile.label=Banco de Chile
bank-reconciliation.banks.chile.columns.date[0]=fecha
bank-reconciliation.banks.chile.columns.description[0]=descripcion
bank-reconciliation.banks.chile.columns.description[1]=detalle
bank-reconciliation.banks.chile.columns.reference[0]=n documento
bank-reconciliation.banks.chile.columns.reference[1]=documento
bank-reconciliation.banks.chile.columns.reference[2]=numero documento
bank-reconciliation.banks.chile.columns.credit[0]=abonos
bank-reconciliation.banks.chile.columns.credit[1]=abono
bank-reconciliation.banks.chile.columns.debit[0]=cargos
bank-reconciliation.banks.chile.columns.debit[1]=cargo

